name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orbit8d-mvp-source.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q orbit8d-mvp-source.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project and test
        working-directory: orbit8d
        run: bash tool/bootstrap.sh

      - name: Build release APK
        working-directory: orbit8d
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit8d-android-apk
          path: orbit8d/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
